name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 4 days at 04:00 UTC to prevent Supabase free tier inactivity pause
    - cron: '0 4 */4 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Skipping: SUPABASE_URL or SUPABASE_ANON_KEY repository secrets not configured."
            exit 0
          fi
          echo "Pinging Supabase REST endpoint to keep free-tier project active..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase response code: $STATUS"

